# =========================================================================
#  Nginx — proxy reverso HTTPS para a app Flask (Gunicorn em 127.0.0.1:8000)
#  Instale em: /etc/nginx/sites-available/projeto-seguro
#  Ative:      sudo ln -s /etc/nginx/sites-available/projeto-seguro \
#                         /etc/nginx/sites-enabled/
#              sudo nginx -t && sudo systemctl reload nginx
#
#  Esta é a configuração real em produção. Dois endereços são servidos:
#    - 144.22.166.21              -> cert Let's Encrypt de IP (short-lived, 6 dias)
#    - 144-22-166-21.sslip.io     -> cert Let's Encrypt padrão (90 dias), usado
#                                    apenas para o teste Qualys SSL Labs (nota A+).
#  sslip.io resolve para o mesmo IP; nenhum domínio foi registrado.
#  Requer Nginx com OpenSSL 3.5+ (para o PQC X25519MLKEM768).
# =========================================================================

# ---- Bloco HTTP (porta 80): ACME + redireciona TUDO para HTTPS ---------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Necessário para o Certbot validar via webroot na emissão/renovação.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirecionamento automático 80 -> 443 (Eixo 1, obrigatório).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Bloco HTTPS por IP (default) --------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 144.22.166.21;

    ssl_certificate     /etc/letsencrypt/live/144.22.166.21/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144.22.166.21/privkey.pem;

    include /etc/nginx/snippets/tls-pqc.conf;
}

# ---- Bloco HTTPS por hostname (sslip.io) — para o teste SSL Labs -------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 144-22-166-21.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/144-22-166-21.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/144-22-166-21.sslip.io/privkey.pem;

    include /etc/nginx/snippets/tls-pqc.conf;
}

