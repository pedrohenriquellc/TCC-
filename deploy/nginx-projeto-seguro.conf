# =========================================================================
#  Nginx — proxy reverso HTTPS para a app Flask (Gunicorn em 127.0.0.1:8000)
#  Instale em: /etc/nginx/sites-available/projeto-seguro
#  Ative:      sudo ln -s /etc/nginx/sites-available/projeto-seguro \
#                         /etc/nginx/sites-enabled/
#              sudo nginx -t && sudo systemctl reload nginx
#
#  SUBSTITUA  SEU_IP_PUBLICO  pelo IP público da sua VM (ex.: 168.75.10.20).
# =========================================================================

# ---- Bloco HTTP (porta 80): redireciona TUDO para HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name SEU_IP_PUBLICO;

    # Necessário para o Certbot validar via webroot na renovação.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirecionamento automático 80 -> 443 (Eixo 1, obrigatório).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Bloco HTTPS (porta 443) -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_IP_PUBLICO;

    # Certificado emitido pelo Let's Encrypt para o IP público.
    # (o diretório usa o IP como nome — veja o guia de infraestrutura)
    ssl_certificate     /etc/letsencrypt/live/SEU_IP_PUBLICO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_IP_PUBLICO/privkey.pem;

    # --- TLS moderno (Secure by Default) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # === PQC — Post-Quantum Cryptography (Eixo 1, obrigatório) ==========
    # Prioriza a troca de chaves híbrida X25519MLKEM768 (ML-KEM / FIPS 203),
    # com fallback clássico para clientes antigos.
    # Requer Nginx compilado com OpenSSL 3.5+ (verifique: openssl version).
    ssl_ecdh_curve X25519MLKEM768:X25519:P256MLKEM768:secp256r1;
    # ===================================================================

    # HSTS reforçado no servidor (a app também envia o header).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Proxy reverso para a aplicação Flask/Gunicorn.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
