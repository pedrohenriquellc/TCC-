# =========================================================================
#  Snippet TLS + PQC + proxy — compartilhado pelos blocos 443 do Nginx.
#  Instale em: /etc/nginx/snippets/tls-pqc.conf
#  Referenciado por: deploy/nginx-projeto-seguro.conf (include ...)
#  Requer OpenSSL 3.5+ (para o grupo pós-quântico X25519MLKEM768).
# =========================================================================

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;

# PQC: troca de chave híbrida ML-KEM (FIPS 203) + fallback clássico
ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1:secp256r1;

# HSTS único e válido (exigido para nota A+ no SSL Labs; o proxy_hide_header
# abaixo remove o HSTS que o app Flask também envia, evitando duplicidade)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

location / {
    proxy_hide_header Strict-Transport-Security;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
